group = "com.bidscube.sdk.flutter"
version = "1.2.3"

buildscript {
    ext.kotlin_version = "1.9.22"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.3.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// Default MAX adapter for Flutter: banner + interstitial + rewarded (IMA video).
ext.bidscubeMaxAdapterVersion = "1.2.10"
ext.bidscubeMaxAdapterArtifact = "applovin-bidscube-max-adapter-full-video"

android {
    namespace = "com.bidscube.sdk.flutter"
    compileSdk = 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    lint {
        disable "InvalidPackage"
    }
}

def bidscubeLocalAdapterAar = null
def libsDir = file("${projectDir}/libs")
if (libsDir.isDirectory()) {
    def adapterCandidates = libsDir.listFiles()?.findAll { f ->
        f.isFile() && f.name.endsWith(".aar") &&
            f.name.toLowerCase().contains("applovin-bidscube-max-adapter")
    }
    if (adapterCandidates != null && !adapterCandidates.isEmpty()) {
        bidscubeLocalAdapterAar = adapterCandidates.sort { it.name }.first()
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.3"
    if (bidscubeLocalAdapterAar != null) {
        implementation files(bidscubeLocalAdapterAar)
        println "bidscube_sdk_flutter: using local MAX adapter AAR: ${bidscubeLocalAdapterAar.name}"
    } else {
        implementation "com.bidscube:${bidscubeMaxAdapterArtifact}:${bidscubeMaxAdapterVersion}"
        println "bidscube_sdk_flutter: using Maven com.bidscube:${bidscubeMaxAdapterArtifact}:${bidscubeMaxAdapterVersion}"
    }
}

tasks.register("verifyBidscubeMaxAdapter") {
    group = "verification"
    description = "Prints Bidscube MAX adapter resolution hints (host app must contain BidscubeMediationAdapter)."
    doLast {
        if (bidscubeLocalAdapterAar != null) {
            println "Local adapter AAR: ${bidscubeLocalAdapterAar.name}"
        } else {
            println "Maven adapter: com.bidscube:${bidscubeMaxAdapterArtifact}:${bidscubeMaxAdapterVersion}"
        }
        println ""
        println "Verify in the Flutter host app:"
        println "  cd android && ./gradlew :app:dependencies | grep -i bidscube"
        println "Inspect APK / merged dex for:"
        println "  com.applovin.mediation.adapters.BidscubeMediationAdapter"
        println ""
        println "Do not depend on com.bidscube:bidscube-sdk alone for AppLovin MAX mediation."
    }
}
