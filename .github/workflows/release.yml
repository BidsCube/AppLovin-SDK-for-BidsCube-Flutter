# GitHub Release on push of tag v* (e.g. v1.2.3).
# pubspec.yaml version must match the tag without the v prefix.
#
# pub.dev publish is OPTIONAL (separate job). Enable only after OIDC is configured:
#   pub.dev package admin → Automated publishing → link this GitHub repo
#   GitHub repo → Settings → Secrets and variables → Actions → Variables:
#     PUB_DEV_PUBLISH_ENABLED = true
#
# Without that variable, tag push creates GitHub Release only (fast, no hang).
# Manual pub.dev: dart pub publish -f  (local) or re-run workflow with publish_pub_dev.

name: Release (pub.dev + GitHub)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pub_dev:
        description: "Attempt pub.dev publish (requires OIDC on pub.dev)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pubspec version matches tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "Git tag (no v): $TAG"
          echo "pubspec version:   $VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::pubspec version ($VER) does not match tag (v$TAG). Update pubspec or retag."
            exit 1
          fi
          echo "RELEASE_VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Setup Java (Android plugin verification)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter (pin from .github/flutter-version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .github/flutter-version
          channel: stable
          cache: true

      - name: Disable analytics (CI)
        run: flutter config --no-analytics

      - name: Versions
        run: |
          flutter --version
          dart --version

      - name: Dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: pub publish --dry-run
        run: flutter pub publish --dry-run

      - name: GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: bidscube_sdk_flutter ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          body: |
            ## Install

            **GitHub** (path or git dependency):

            ```yaml
            dependencies:
              bidscube_sdk_flutter:
                git:
                  url: https://github.com/${{ github.repository }}.git
                  ref: ${{ github.ref_name }}
            ```

            **pub.dev** (when published):

            ```yaml
            dependencies:
              bidscube_sdk_flutter: ^${{ env.RELEASE_VERSION }}
            ```

            Docs: [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md)

            See [RELEASE.md](https://github.com/${{ github.repository }}/blob/main/RELEASE.md) for pub.dev OIDC setup.

  publish-pubdev:
    needs: release
    runs-on: ubuntu-latest
    # Skip by default — avoids 5–15 min hang when pub.dev OIDC is not linked.
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.publish_pub_dev) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.PUB_DEV_PUBLISH_ENABLED == 'true')
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .github/flutter-version
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Verify pub.dev OIDC prerequisites
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::warning::OIDC unavailable (id-token: write). Skipping pub.dev."
            exit 1
          fi
          echo "OIDC token endpoint available."

      - name: Publish to pub.dev
        timeout-minutes: 3
        shell: bash
        run: |
          set +e
          output="$(timeout 120 dart pub publish -f 2>&1)"
          rc=$?
          echo "$output"
          if [ "$rc" -eq 124 ]; then
            echo "::warning::pub publish timed out after 2 minutes."
            echo "Enable Automated publishing on pub.dev for this repo, or publish locally: dart pub publish -f"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            if echo "$output" | grep -qi "already exists"; then
              echo "Version already on pub.dev."
              exit 0
            fi
            echo "::warning::pub.dev publish failed (rc=$rc). GitHub Release is still valid."
            exit "$rc"
          fi
          echo "Published to pub.dev successfully."
